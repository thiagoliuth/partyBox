<dialog class="evento-dialog" id="cadastro-evento" aria-labelledby="cadastro-evento-titulo" {% if evento_form.errors %}data-evento-open-on-load{% endif %}>
    <div class="evento-dialog-panel">
        <header class="evento-dialog-header">
            <div>
                <p class="eyebrow">Compartilhe com a comunidade</p>
                <h2 id="cadastro-evento-titulo">Cadastrar evento</h2>
            </div>
            <button class="evento-dialog-close" type="button" data-evento-close aria-label="Fechar cadastro">×</button>
        </header>
        <form class="evento-form" method="post" action="{% url 'cadastrar_evento' %}" enctype="multipart/form-data">
            {% csrf_token %}
            {% include "home/includes/evento_form_fields.html" with form=evento_form %}
            <footer class="evento-form-actions">
                <button class="button button-secondary" type="button" data-evento-close>Cancelar</button>
                <button class="button button-primary" type="submit">Publicar evento</button>
            </footer>
        </form>
    </div>
</dialog>
