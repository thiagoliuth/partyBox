<header class="aa-dialog-header">
    <div>
        <p class="aa-kicker">{{ chamada }}</p>
        <h2 id="{{ titulo_id }}">{{ titulo }}</h2>
    </div>
    <button class="aa-button aa-button-outline aa-dialog-close" type="button" {% if evento %}data-evento-close autofocus{% else %}data-auth-close{% endif %} aria-label="{{ fechar }}">
        <svg class="aa-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
    </button>
</header>
